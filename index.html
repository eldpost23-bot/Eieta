    <!-- TABS -->

            'Mantequilla de cacahuete (1 cucharada 16g)',
            'Mantequilla de almendra (1 cucharada 16g)'
        ]
    };

    // ===== FUNCIONES =====
    function goTab(tab) {
        currentTab = tab;
        selectedMeal = null;
        selectedMealForRegistro = null;
        render();
    }

    function updateInputs() {
        render();
    }

    function render() {
        // Actualizar botones
        document.getElementById('tabPlan').className = currentTab === 'plan' ? 'flex-1 py-3 rounded-lg font-bold transition bg-emerald-600 text-white shadow-lg' : 'flex-1 py-3 rounded-lg font-bold transition bg-white text-gray-900 border-2 border-gray-200';
        document.getElementById('tabRegistro').className = currentTab === 'registro' ? 'flex-1 py-3 rounded-lg font-bold transition bg-emerald-600 text-white shadow-lg' : 'flex-1 py-3 rounded-lg font-bold transition bg-white text-gray-900 border-2 border-gray-200';
        document.getElementById('tabEquiv').className = currentTab === 'equivalencias' ? 'flex-1 py-3 rounded-lg font-bold transition bg-emerald-600 text-white shadow-lg' : 'flex-1 py-3 rounded-lg font-bold transition bg-white text-gray-900 border-2 border-gray-200';

        // Renderizar contenido
        let html = '';
        if (currentTab === 'plan') {
            html = renderPlan();
        } else if (currentTab === 'registro') {
            html = renderRegistro();
        } else {
            html = renderEquivalencias();
        }
        
        document.getElementById('content').innerHTML = html;
    }

    function renderPlan() {
        let html = `
            <div class="space-y-4">
                <!-- SELECTOR DE DÍA -->
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="selectedDay='rest'; selectedMeal=null; render()" class="p-4 rounded-lg font-bold text-center transition ${selectedDay === 'rest' ? 'bg-emerald-600 text-white shadow-lg scale-105' : 'bg-white border-2 border-gray-300'}">
                        <div class="text-2xl mb-1">😴</div>
                        <div class="text-sm">Descanso</div>
                    </button>
                    <button onclick="selectedDay='morning'; selectedMeal=null; render()" class="p-4 rounded-lg font-bold text-center transition ${selectedDay === 'morning' ? 'bg-emerald-600 text-white shadow-lg scale-105' : 'bg-white border-2 border-gray-300'}">
                        <div class="text-2xl mb-1">🌅</div>
                        <div class="text-sm">Entreno Mañana</div>
                    </button>
                    <button onclick="selectedDay='afternoon'; selectedMeal=null; render()" class="p-4 rounded-lg font-bold text-center transition ${selectedDay === 'afternoon' ? 'bg-emerald-600 text-white shadow-lg scale-105' : 'bg-white border-2 border-gray-300'}">
                        <div class="text-2xl mb-1">🌙</div>
                        <div class="text-sm">Entreno Tarde</div>
                    </button>
                </div>

                <!-- PLAN DETALLADO -->
                <div class="bg-white rounded-lg p-6 shadow-lg">
                    <h2 class="text-2xl font-bold text-emerald-700 mb-4">${plans[selectedDay].name}</h2>
                    
                    <div class="space-y-3 mb-6">
                        ${Object.entries(plans[selectedDay]).filter(([k]) => k !== 'name').map(([meal, raciones]) => `
                            <button onclick="selectedMeal='${meal}'; render()" class="w-full text-left bg-gradient-to-r from-emerald-50 to-teal-50 hover:from-emerald-100 hover:to-teal-100 rounded-lg p-4 border-l-4 border-emerald-600 transition ${selectedMeal === meal ? 'ring-2 ring-emerald-600' : ''}">
                                <p class="font-bold text-lg text-gray-900 mb-3">${meal}</p>
                                <div class="grid grid-cols-3 sm:grid-cols-6 gap-2">
                                    ${['LAC','HC','PRO','VER','FRU','GRA'].map(g => `
                                        <div class="text-center">
                                            <p class="text-2xl">${emojis[g]}</p>
                                            <p class="text-xl font-black text-emerald-600">${raciones[g]}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </button>
                        `).join('')}
                    </div>

                    ${selectedMeal ? `
                        <!-- DETALLES DE LA COMIDA SELECCIONADA -->
                        <div class="bg-gradient-to-r from-blue-50 to-cyan-50 rounded-lg p-6 border-2 border-blue-300 mb-6">
                            <h3 class="text-2xl font-bold text-blue-700 mb-4">📋 ${selectedMeal} - Valores que debes tener</h3>
                            <div class="grid grid-cols-3 gap-3">
                                ${['LAC','HC','PRO','VER','FRU','GRA'].map(g => {
                                    const valor = plans[selectedDay][selectedMeal][g];
                                    const nombre = {LAC: 'Lácteos', HC: 'Carbohidratos', PRO: 'Proteínas', VER: 'Verduras', FRU: 'Frutas', GRA: 'Grasas'}[g];
                                    return `
                                        <div class="bg-white rounded-lg p-4 border-2 border-blue-300">
                                            <p class="text-4xl mb-2">${emojis[g]}</p>
                                            <p class="text-sm font-bold text-gray-700">${nombre}</p>
                                            <p class="text-3xl font-black text-blue-600">${valor}</p>
                                            <p class="text-xs text-gray-600 mt-1">raciones</p>
                                        </div>
                                    `;
                                }).join('')}
                            </div>

                            <!-- OPCIONES PARA ESE GRUPO -->
                            <div class="mt-6 space-y-4">
                                ${['LAC','HC','PRO','VER','FRU','GRA'].map(g => {
                                    const valor = plans[selectedDay][selectedMeal][g];
                                    if (valor === 0) return '';
                                    const nombre = {LAC: 'Lácteos', HC: 'Carbohidratos', PRO: 'Proteínas', VER: 'Verduras', FRU: 'Frutas', GRA: 'Grasas'}[g];
                                    return `
                                        <div class="bg-white rounded-lg p-4">
                                            <p class="font-bold text-lg text-gray-900 mb-2">${emojis[g]} ${nombre} (${valor} ración${valor > 1 ? 'es' : ''})</p>
                                            <div class="grid grid-cols-1 gap-2">
                                                ${equivalencias[g].slice(0, 6).map(eq => `<p class="text-sm text-gray-700">✓ ${eq}</p>`).join('')}
                                                ${equivalencias[g].length > 6 ? `<p class="text-xs text-blue-600 font-bold">+ ${equivalencias[g].length - 6} opciones más en la pestaña INFO</p>` : ''}
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <!-- TOTAL -->
                    <div class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-lg p-4">
                        <p class="font-bold text-lg mb-3">📊 TOTAL DEL DÍA</p>
                        <div class="grid grid-cols-3 sm:grid-cols-6 gap-2">
                            ${['LAC','HC','PRO','VER','FRU','GRA'].map(g => `
                                <div class="text-center">
                                    <p class="text-2xl">${emojis[g]}</p>

                                </div>
                            `).join('')}

                    </div>
                </div>
            </div>
        `;
        return html;
    }

    function renderRegistro() {
        const dayMeals = meals[selectedDate] || [];
        const plan = plans[selectedDay];
        let consumed = { LAC: 0, HC: 0, PRO: 0, VER: 0, FRU: 0, GRA: 0 };
        dayMeals.forEach(m => {
            Object.keys(consumed).forEach(g => consumed[g] += m[g] || 0);
        });

        const mealTypes = Object.keys(plan).filter(k => k !== 'name');

        // Valores ingresados actualmente
        let currentInputs = { LAC: 0, HC: 0, PRO: 0, VER: 0, FRU: 0, GRA: 0 };
        ['LAC','HC','PRO','VER','FRU','GRA'].forEach(g => {
            const val = document.getElementById(`val_${g}`);
            if (val) currentInputs[g] = parseInt(val.value) || 0;
        });

        // Valores objetivo para esta comida
        let targetValues = selectedMealForRegistro ? plans[selectedDay][selectedMealForRegistro] : { LAC: 0, HC: 0, PRO: 0, VER: 0, FRU: 0, GRA: 0 };

        let html = `
            <div class="space-y-4">
                <!-- SELECTOR FECHA -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">📅 Fecha:</label>
                    <input type="date" id="dateInput" value="${selectedDate}" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg">
                </div>

                <!-- TIPO DE DÍA PARA REGISTRO -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Tipo de día:</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="selectedDay='rest'; render()" class="p-2 rounded-lg font-bold text-sm ${selectedDay === 'rest' ? 'bg-emerald-600 text-white' : 'bg-gray-100'}">😴 Descanso</button>
                        <button onclick="selectedDay='morning'; render()" class="p-2 rounded-lg font-bold text-sm ${selectedDay === 'morning' ? 'bg-emerald-600 text-white' : 'bg-gray-100'}">🌅 Mañana</button>
                        <button onclick="selectedDay='afternoon'; render()" class="p-2 rounded-lg font-bold text-sm ${selectedDay === 'afternoon' ? 'bg-emerald-600 text-white' : 'bg-gray-100'}">🌙 Tarde</button>
                    </div>
                </div>

                <!-- PROGRESO ACTUAL -->
                <div class="bg-white rounded-lg p-4 shadow">
                    <p class="font-bold text-gray-900 mb-3">Progreso hoy:</p>
                    <div class="grid grid-cols-3 gap-2">
                        ${['LAC','HC','PRO','VER','FRU','GRA'].map(g => {
                            const target = totals[selectedDay][g];
                            const cons = consumed[g];
                            const complete = cons === target;
                            return `
                                <div class="text-center p-2 rounded-lg ${complete ? 'bg-green-100 border-2 border-green-500' : cons > target ? 'bg-yellow-100' : 'bg-gray-100'}">
                                    <p class="text-lg">${emojis[g]}</p>
                                    <p class="text-sm font-bold">${cons}/${target}</p>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>

                <!-- AGREGAR COMIDA -->
                <div class="bg-white rounded-lg p-4 shadow">
                    <p class="font-bold text-gray-900 mb-3">➕ Agregar comida:</p>
                    <div class="space-y-3">
                        <input type="text" id="foodName" placeholder="Ej: Pechuga de pollo" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg">
                        <select id="mealType" onchange="selectedMealForRegistro = this.value; render()" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg">
                            <option value="">-- Selecciona una comida --</option>
                            ${mealTypes.map(m => `<option value="${m}">${m}</option>`).join('')}
                        </select>

                        ${selectedMealForRegistro ? `
                            <!-- VALORES QUE DEBE TENER ESTA COMIDA -->
                            <div class="bg-gradient-to-r from-purple-50 to-pink-50 rounded-lg p-4 border-2 border-purple-300">
                                <p class="font-bold text-gray-900 mb-3">📋 ${selectedMealForRegistro} DEBE TENER:</p>
                                <div class="grid grid-cols-3 gap-2 mb-4">
                                    ${['LAC','HC','PRO','VER','FRU','GRA'].map(g => {
                                        const target = targetValues[g];
                                        const current = currentInputs[g];
                                        const isCorrect = current === target;
                                        const color = target === 0 ? 'gray' : isCorrect ? 'green' : current > target ? 'red' : 'blue';
                                        const bgColor = {
                                            gray: 'bg-gray-100 border-gray-300',
                                            green: 'bg-green-100 border-green-500',
                                            red: 'bg-red-100 border-red-500',
                                            blue: 'bg-blue-100 border-blue-500'
                                        }[color];
                                        const textColor = {
                                            gray: 'text-gray-600',
                                            green: 'text-green-700',
                                            red: 'text-red-700',
                                            blue: 'text-blue-700'
                                        }[color];
                                        return `
                                            <div class="rounded-lg p-3 border-2 text-center ${bgColor}">
                                                <p class="text-2xl">${emojis[g]}</p>
                                                <p class="text-xs font-bold text-gray-700">Objetivo</p>
                                                <p class="text-2xl font-black ${textColor}">${target}</p>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        ` : ''}

                        <!-- INPUTS DE VALORES -->
                        <div class="grid grid-cols-3 gap-2">
                            ${['LAC','HC','PRO','VER','FRU','GRA'].map(g => {
                                const target = targetValues[g];
                                const current = currentInputs[g];
                                const isCorrect = target === 0 || current === target;
                                return `
                                    <div>
                                        <label class="text-xs font-bold block mb-1">${emojis[g]}</label>
                                        <input type="number" id="val_${g}" min="0" max="10" value="${current}" oninput="updateInputs()" class="w-full px-2 py-2 border-2 rounded text-center font-bold ${isCorrect && selectedMealForRegistro ? 'border-green-500 bg-green-50' : 'border-gray-300'}">
                                        ${selectedMealForRegistro ? `<p class="text-xs text-center mt-1 font-bold">${current}/${target}</p>` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        <button onclick="addMeal()" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold hover:bg-emerald-700">Agregar</button>
                    </div>
                </div>

                <!-- COMIDAS REGISTRADAS -->
                ${dayMeals.length > 0 ? `
                    <div class="bg-white rounded-lg p-4 shadow">
                        <p class="font-bold text-gray-900 mb-3">Comidas registradas (${dayMeals.length}):</p>
                        <div class="space-y-2">
                            ${dayMeals.map((m, i) => `
                                <div class="bg-gray-50 p-3 rounded-lg border-l-4 border-emerald-500">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <p class="font-bold text-sm text-gray-900">${m.name}</p>
                                            <p class="text-xs text-gray-600">${m.type}</p>
                                            <div class="flex flex-wrap gap-1 mt-2">
                                                ${['LAC','HC','PRO','VER','FRU','GRA'].map(g => m[g] > 0 ? `<span class="text-xs bg-emerald-200 px-2 py-1 rounded font-bold">${emojis[g]}${m[g]}</span>` : '').join('')}
                                            </div>
                                        </div>
                                        <button onclick="deleteMeal('${selectedDate}', ${i})" class="text-red-600 hover:text-red-800 text-lg">🗑️</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}
            </div>
        `;
        
        setTimeout(() => {
            const dateInput = document.getElementById('dateInput');
            if (dateInput) {
                dateInput.addEventListener('change', (e) => {
                    selectedDate = e.target.value;
                    render();
                });
            }
        }, 0);

        return html;
    }

    function renderEquivalencias() {
        let html = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${Object.entries(equivalencias).map(([grupo, items]) => {
                    const nombres = {
                        LAC: 'Lácteos',
                        HC: 'Carbohidratos',
                        PRO: 'Proteínas',
                        VER: 'Verduras',
                        FRU: 'Frutas',
                        GRA: 'Grasas'
                    };
                    return `
                        <div class="bg-white rounded-lg p-4 shadow">
                            <p class="font-bold text-lg mb-3 text-gray-900">${emojis[grupo]} ${nombres[grupo]} (${items.length} opciones)</p>
                            <div class="space-y-2">
                                ${items.map(item => `<p class="text-sm text-gray-700">• ${item}</p>`).join('')}
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
        return html;
    }

    function addMeal() {
        const name = document.getElementById('foodName').value;
        const type = document.getElementById('mealType').value;
        
        if (!name.trim()) {
            alert('Por favor ingresa un nombre de comida');
            return;
        }

        if (!type) {
            alert('Por favor selecciona una comida');
            return;
        }

        const meal = {
            name,
            type,
            LAC: parseInt(document.getElementById('val_LAC').value) || 0,
            HC: parseInt(document.getElementById('val_HC').value) || 0,
            PRO: parseInt(document.getElementById('val_PRO').value) || 0,
            VER: parseInt(document.getElementById('val_VER').value) || 0,
            FRU: parseInt(document.getElementById('val_FRU').value) || 0,
            GRA: parseInt(document.getElementById('val_GRA').value) || 0
        };

        if (!meals[selectedDate]) meals[selectedDate] = [];
        meals[selectedDate].push(meal);
        localStorage.setItem('meals', JSON.stringify(meals));
        
        document.getElementById('foodName').value = '';
        document.getElementById('mealType').value = '';
        selectedMealForRegistro = null;
        ['LAC','HC','PRO','VER','FRU','GRA'].forEach(g => document.getElementById('val_' + g).value = '0');
        
        render();
    }

    function deleteMeal(date, index) {
        meals[date].splice(index, 1);
        localStorage.setItem('meals', JSON.stringify(meals));
        render();
    }

    // INICIAR
    render();
</script>
